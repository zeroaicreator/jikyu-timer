<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- iPhoneアプリ風 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="時給タイマー">

  <title>時給タイマー</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- JS -->
  <script src="script.js" defer></script>
</head>
<body>

  <div class="app">
    <div class="app-title">時給タイマー</div>

    <label>日付</label>
    <input type="date" id="workDate" />

    <label>時給（円）</label>
    <input type="number" id="hourlyWage" />

    <label>開始時刻</label>
    <input type="time" id="startTime" />

    <label>終了時刻</label>
    <input type="time" id="endTime" />

    <button onclick="saveShift()">シフトを保存</button>

    <hr />

    <h2>今日の稼ぎ</h2>

    <div class="earnings-card">
      <div id="earnings" class="earnings-amount">¥0</div>
    </div>

    <div class="sub-info">
      <div id="wageInfo">時給 ¥0</div>
      <div id="elapsedTime">経過 0時間0分</div>
    </div>
  </div>

</body>
</html>
